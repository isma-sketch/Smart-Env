name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Multi-Platform Binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -o smart-env-windows-amd64.exe ./cmd/smart-env
          GOOS=linux GOARCH=amd64 go build -o smart-env-linux-amd64 ./cmd/smart-env
          GOOS=darwin GOARCH=arm64 go build -o smart-env-darwin-arm64 ./cmd/smart-env

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            smart-env-windows-amd64.exe
            smart-env-linux-amd64
            smart-env-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}